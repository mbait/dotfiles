---
- name: Ensure ~/.config exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory

- name: Symlink per-tool dirs into ~/.config
  file:
    src: "{{ playbook_dir }}/../../dotfiles/{{ item }}"
    dest: "{{ lookup('env', 'HOME') }}/.config/{{ item }}"
    state: link
    force: "{{ overwrite_existing }}"
  loop:
    - emacs
    - tmux
    - vim

- name: Ensure ~/.config/git exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/git"
    state: directory

- name: Symlink individual files into ~/.config/git
  file:
    src: "{{ playbook_dir }}/../../dotfiles/git/{{ item }}"
    dest: "{{ lookup('env', 'HOME') }}/.config/git/{{ item }}"
    state: link
    force: "{{ overwrite_existing }}"
  loop:
    - config
    - ignore

- name: Symlink top-level dotfiles
  file:
    src: "{{ playbook_dir }}/../../dotfiles/{{ item.src }}"
    dest: "{{ lookup('env', 'HOME') }}/{{ item.dest }}"
    state: link
    force: "{{ overwrite_existing }}"
  loop:
    - { src: 'toprc',    dest: '.toprc' }
    - { src: 'screenrc', dest: '.screenrc' }
    - { src: 'bin',      dest: 'bin' }

- name: Ensure ~/.gnupg exists with secure perms
  file:
    path: "{{ lookup('env', 'HOME') }}/.gnupg"
    state: directory
    mode: '0700'

- name: Symlink ~/.gnupg/gpg-agent.conf
  file:
    src: "{{ playbook_dir }}/../../dotfiles/gpg-agent.conf"
    dest: "{{ lookup('env', 'HOME') }}/.gnupg/gpg-agent.conf"
    state: link
    force: "{{ overwrite_existing }}"
  notify: Reload gpg-agent
